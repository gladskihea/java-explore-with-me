version: '3.8'

services:

  # 1. База данных для статистики
  stats-db:
    image: postgres:16.1
    container_name: ewm-stats-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ewm_stats
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ewm_stats"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Сервер статистики
  stats-server:
    build:
      context: ./ewm-stats-service/stats-server
    container_name: ewm-stats-server
    ports:
      - "9090:9090"
    environment:
      - DB_HOST=stats-db
      - DB_PORT=5432
      - POSTGRES_DB=ewm_stats
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    depends_on:
      stats-db:
        condition: service_healthy

